openapi: 3.0.3
info:
  title: ScreenGuide AI API
  version: 0.2.0
  description: |
    REST API for ScreenGuide AI. All routes are under `/api`.
    Errors always have the shape `{ "error": { "code", "message", "details"? } }`.
    Every response carries an `X-Request-Id` header (send a UUID in `X-Request-Id` to set it).
servers:
  - url: /api
tags:
  - name: Health
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: |
        Runs `SELECT 1` against the database. Same contract as Resolvd's health route.
        Render's health check points here.
      responses:
        '200':
          description: The API and its database are up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example: { status: ok, database: up }
        '503':
          description: The database is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example: { status: degraded, database: down }
  /ready:
    get:
      tags: [Health]
      summary: Readiness check
      description: ScreenGuide addition. Checks the database and the job queue.
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example: { status: ok, database: up, jobs: up }
        '503':
          description: The database or the job queue is down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example: { status: degraded, database: down, jobs: down }
components:
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [up, down]
    Readiness:
      type: object
      required: [status, database, jobs]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [up, down]
        jobs:
          type: string
          enum: [up, down]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Some fields are missing or invalid
            details:
              description: |
                Extra information. For `VALIDATION_ERROR` it is Zod's flattened error,
                `{ "formErrors": string[], "fieldErrors": { "<field>": string[] } }` (same as Resolvd).
  responses:
    RateLimited:
      description: Too many requests (`RATE_LIMITED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such resource or route (`NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
